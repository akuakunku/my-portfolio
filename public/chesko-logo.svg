<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="cyber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f3ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bc13fe;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Outer Hexagon Frame -->
  <path d="M50 5 L90 25 L90 75 L50 95 L10 75 L10 25 Z" fill="none" stroke="url(#cyber-grad)" stroke-width="2" filter="url(#glow)"/>
  
  <!-- Stylized 'C' -->
  <path d="M70 35 A25 25 0 1 0 70 65" fill="none" stroke="url(#cyber-grad)" stroke-width="8" stroke-linecap="square" filter="url(#glow)"/>
  
  <!-- Central Core -->
  <circle cx="50" cy="50" r="5" fill="#00f3ff">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" />
  </circle>
  
  <!-- Tech Details -->
  <line x1="50" y1="5" x2="50" y2="15" stroke="#00f3ff" stroke-width="1" />
  <line x1="50" y1="85" x2="50" y2="95" stroke="#00f3ff" stroke-width="1" />
</svg>